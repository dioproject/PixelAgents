[package]
name = "pixel-sinergi"
version = "0.1.0"
description = "PT Pixel Sinergi Nusantara Tbk — pixel corporate AI simulation"
authors = ["Pixel Sinergi"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pixel_sinergi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
