<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PT Pixel Sinergi Nusantara Tbk — CEO Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23101218'/><rect x='3' y='3' width='10' height='10' fill='%23ffc857'/><rect x='5' y='5' width='2' height='2' fill='%2314151f'/><rect x='9' y='5' width='2' height='2' fill='%2314151f'/><rect x='5' y='9' width='6' height='2' fill='%2314151f'/></svg>" />
  </head>
  <body>
    <div id="app">
      <!-- ================= TOPBAR ================= -->
      <header id="topbar">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true"></span>
          <div class="brand-text">
            <strong>PT PIXEL SINERGI NUSANTARA Tbk</strong>
            <small>CEO Dashboard · Mode Pengawasan Penuh</small>
          </div>
        </div>

        <div class="clock-box">
          <span id="clock-day">Hari 1</span>
          <span id="clock-time">08:30</span>
          <span id="clock-fps" class="fps">60fps</span>
        </div>

        <div class="topbar-controls">
          <button id="btn-pause" class="btn icon-btn" title="Jeda / Lanjut (Space)">⏸</button>
          <select id="speed-select" class="select" title="Kecepatan waktu">
            <option value="1">1x</option>
            <option value="2" selected>2x</option>
            <option value="4">4x</option>
            <option value="8">8x</option>
            <option value="16">16x</option>
          </select>
          <button id="btn-directive" class="btn gold-btn" title="Keluarkan perintah sebagai Direktur">📜 Titah Direksi</button>
          <button id="btn-settings" class="btn icon-btn" title="Pengaturan LLM">⚙️</button>
          <button id="btn-help" class="btn icon-btn" title="Tentang">❓</button>
        </div>
      </header>

      <!-- ================= WORKSPACE ================= -->
      <main id="workspace">
        <!-- Sidebar kiri: CCTV navigation + statistik -->
        <aside id="sidebar-left">
          <div class="panel">
            <div class="panel-title">📺 CCTV NAVIGATOR</div>
            <div id="room-nav" class="room-nav"></div>
          </div>
          <div class="panel">
            <div class="panel-title">📊 STATISTIK KANTOR</div>
            <div id="office-stats" class="stats-list"></div>
          </div>
        </aside>

        <!-- Stage: canvas + overlay DOM -->
        <section id="stage">
          <canvas id="world" aria-label="Kantor pixel PT Pixel Sinergi Nusantara"></canvas>
          <div id="overlay">
            <div id="room-labels"></div>
            <div id="bubble-layer"></div>
            <div id="cctv-frame">
              <span class="rec-dot"></span>
              <span class="rec-label">REC · LIVE</span>
            </div>
          </div>
          <div id="hint-bar">🖱️ Drag untuk pan · Scroll untuk zoom · Klik karyawan untuk inspeksi</div>
        </section>

        <!-- Sidebar kanan: feed + daftar karyawan / inspector -->
        <aside id="sidebar-right">
          <div id="feed-panel" class="panel grow">
            <div class="panel-title">
              💬 LIVE OFFICE FEED
              <span id="feed-count" class="badge">0</span>
            </div>
            <div class="feed-tabs">
              <button data-tab="all" class="tab active">Semua</button>
              <button data-tab="kerja" class="tab">Kerja</button>
              <button data-tab="gosip" class="tab">Gosip</button>
              <button data-tab="hr" class="tab">HR</button>
            </div>
            <div id="feed-list" class="feed-list"></div>
          </div>

          <div id="agent-panel" class="panel grow">
            <div class="panel-title">
              👥 KARYAWAN
              <span id="agent-count" class="badge">10</span>
            </div>
            <div id="agent-list" class="agent-list"></div>
          </div>

          <div id="inspector-panel" class="panel grow hidden">
            <div class="panel-title">
              🪪 PROFIL KARYAWAN
              <button id="inspector-close" class="btn tiny-btn" title="Tutup">✕</button>
            </div>
            <div id="inspector-body" class="inspector-body"></div>
          </div>
        </aside>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
